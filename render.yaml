services:
  - type: web
    name: offboard-guard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COGNO_URI
        sync: false
      - key: COGNO_USER
        sync: false
      - key: COGNO_PASSWORD
        sync: false
